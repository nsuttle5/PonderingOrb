<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Eight Ball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main>
    <audio id="background-music" src="Wizard_Tower_Theme.mp3"
           loop preload="auto" autoplay></audio>
    <nav class="page-switch" aria-label="Pages">
      <a class="page-link is-active" href="index.html" aria-current="page">Crystal Ball</a>
      <a class="page-link" href="tarot.html">Tarot Reading</a>
    </nav>

    <section class="mode-panel" id="orb-panel">
      <audio id="fart-sound" src="fart_sound.wav" preload="auto"></audio>
    <div class="frame" id="frame">
        <div class="stage">
          <video id="loop" src="eightball.mp4" poster="poster.jpg"
                 autoplay loop muted playsinline preload="auto" aria-hidden="true"></video>
          <div class="window" aria-hidden="true">
            <p class="answer" id="answer"></p>
          </div>
        </div>
        <button class="hit" id="hit" type="button" aria-label="Ask the ball"></button>
      </div>

      <p class="hint" id="hint">Press the ball to ask</p>

      <fieldset class="types" id="types">
        <legend class="sr">Answer type</legend>
      </fieldset>
    </section>

    <button class="music-toggle" id="music-toggle" type="button"
            aria-pressed="true">Play music</button>

    <p class="sr" id="live" aria-live="polite"></p>
  </main>
  <script src="stars.js"></script>
  <script src="script.js"></script>
</body>
</html>
